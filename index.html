/* ---------- 10. Categorias ---------- */
async function criarCategoria(nome) {
  nome = String(nome || '').trim(); if (!nome) return null;
  const existe = S.categorias.find(c => c.nome.toLowerCase() === nome.toLowerCase());
  if (existe) return existe;
  const c = { id: uid(), nome, cor: CORES[S.categorias.length % CORES.length] };
  try { await DB.gravar('categorias', c); } catch (e) { erroAoSalvar(e); return null; }
  S.categorias.push(c);
  S.categorias.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return c;
}
async function excluirCategoria(id) {
  const c = categoria(id); if (!c) return;
  const usadas = S.demandas.filter(d => d.categoriaId === id);
  const ok = await confirmar(`Excluir a categoria "${c.nome}"?${usadas.length ? ` ${usadas.length} ${plural(usadas.length, 'demanda ficará', 'demandas ficarão')} sem categoria (as demandas não são apagadas).` : ''}`, { ok: 'Excluir', perigo: true });
  if (!ok) return;
  try {
    await DB.apagar('categorias', id);
    for (const d of usadas) { d.categoriaId = ''; d.atualizadoEm = Date.now(); await DB.gravar('demandas', d); }
  } catch (e) { erroAoSalvar(e); return; }
  S.categorias = S.categorias.filter(x => x.id !== id);
  if (S.lista.cat === id) S.lista.cat = '';
  render();
}

/* ---------- 11. Backup (exportar / importar) ---------- */
function blobParaBase64(blob) {
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = () => falha(r.error);
    r.readAsDataURL(blob);
  });
}
function base64ParaBlob(b64, tipo) {
  const bin = atob(b64 || ''); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: tipo || 'application/octet-stream' });
}
async function gerarBackup() {
  const [dem, cats, anx, arqs] = await Promise.all([DB.todos('demandas'), DB.todos('categorias'), DB.todos('anexos'), DB.todos('arquivos')]);
  const anexos = [], arquivos = [];
  for (const a of anx) { const { blob, ...meta } = a; anexos.push({ ...meta, dados: await blobParaBase64(blob) }); }
  for (const a of arqs) { const { blob, ...meta } = a; arquivos.push({ ...meta, dados: await blobParaBase64(blob) }); }
  const obj = { app: 'agenda-demandas', versao: 2, exportadoEm: new Date().toISOString(), demandas: dem, categorias: cats, anexos, arquivos };
  return new Blob([JSON.stringify(obj)], { type: 'application/json' });
}
async function exportarBackup(compartilhar) {

async function importarBackup(arquivo) {
  let obj;
  try { obj = JSON.parse(await arquivo.text()); } catch (e) { toast('Arquivo inválido ou corrompido'); return; }
  if (!obj || obj.app !== 'agenda-demandas' || !Array.isArray(obj.demandas)) { toast('Este arquivo não é um backup da agenda'); return; }
  const nAnx = (obj.anexos || []).length, nArq = (obj.arquivos || []).length;
  const modo = await modal({
    titulo: 'Importar backup',
    html: `<p>Backup de <b>${fmtDataHora(Date.parse(obj.exportadoEm))}</b> com ${obj.demandas.length} ${plural(obj.demandas.length, 'demanda', 'demandas')} ${nAnx} ${plural(nAnx, 'anexo', 'anexos')} e ${nArq} ${plural(nArq, 'arquivo', 'arquivos')} na área Arquivos.</p>
      <p><b>Mesclar:</b> junta com o que já existe neste aparelho. Se a mesma demanda estiver nos dois, fica a versão editada mais recentemente.</p>
      <p><b>Substituir tudo:</b> apaga os dados deste aparelho e coloca os do backup.</p>`,
    botoes: [{ t: 'Cancelar', v: null }, { t: 'Substituir tudo', v: 'substituir', cls: 'btn-perigo' }, { t: 'Mesclar', v: 'mesclar', cls: 'btn-pri' }]
  });
  if (!modo) return;
  if (modo === 'substituir' && !(await confirmar('Tem certeza? Todos os dados atuais deste aparelho serão apagados e trocados pelos do backup.', { ok: 'Substituir', perigo: true }))) return;
  const aviso = toast('Importando…', { tempo: 0 });
  try {
    const porDemanda = {};
    const anexos = (obj.anexos || []).map(a => {
      const { dados, ...meta } = a;
      const x = { ...meta, blob: base64ParaBlob(dados, a.tipo) };
      (porDemanda[a.demandaId] = porDemanda[a.demandaId] || []).push(x);
      return x;
    });
    const arquivos = Array.isArray(obj.arquivos) ? obj.arquivos.map(a => { const { dados, ...meta } = a; return { ...meta, blob: base64ParaBlob(dados, a.tipo) }; }) : null;
    let n = 0;
    if (modo === 'substituir') {
      await DB.substituirTudo(obj.demandas, obj.categorias || [], anexos, arquivos);
      n = obj.demandas.length;
    } else {
      for (const c of obj.categorias || []) if (!categoria(c.id)) await DB.gravar('categorias', c);
      const jaTem = new Set(S.arquivos.map(a => a.id));
      const novosArq = (arquivos || []).filter(a => !jaTem.has(a.id));
      if (novosArq.length) await DB.gravarVarios('arquivos', novosArq);
      const atuais = new Map(S.demandas.map(d => [d.id, d]));
      for (const d of obj.demandas) {
        const ex = atuais.get(d.id);
        if (!ex || (d.atualizadoEm || 0) > (ex.atualizadoEm || 0)) { await DB.substituirDemanda(d, porDemanda[d.id] || []); n++; }
      }
    }
    await carregarDados();
    aviso.remove();
    render();
    toast(`Importação concluída: ${n} ${plural(n, 'demanda atualizada', 'demandas atualizadas')}`);
  } catch (e) { aviso.remove(); erroAoSalvar(e); }
}

function modal({ titulo, html, botoes = [{ t: 'OK', v: true, cls: 'btn-pri' }], grande = false, classe = '', ler = null }) {
  return new Promise(ok => {
    const w = document.createElement('div');
    w.className = 'modal-wrap ' + classe;
    w.innerHTML = `<div class="modal ${grande ? 'grande' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <div class="modal-h">${esc(titulo)}</div><div class="modal-b">${html}</div>
      <div class="modal-f">${botoes.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div></div>`;
    const fechar = v => { const extra = ler ? ler(w) : undefined; w.remove(); document.removeEventListener('keydown', tecla, true); ok(ler ? { v, extra } : v); };
    const tecla = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); fechar(null); } };
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { fechar(botoes[+b.dataset.i].v); return; }
      if (e.target === w || e.target.closest('[data-act]')) fechar(null);
    });
    document.addEventListener('keydown', tecla, true);
    $('#modal-root').appendChild(w);
    const foco = w.querySelector('.btn-pri') || w.querySelector('.btn');
    if (foco) foco.focus();
  });
}
const confirmar = (msg, { ok = 'Confirmar', perigo = false } = {}) =>
  modal({ titulo: 'Confirmar', html: `<p>${esc(msg)}</p>`, botoes: [{ t: 'Cancelar', v: false }, { t: ok, v: true, cls: perigo ? 'btn-perigo' : 'btn-pri' }] }).then(v => v === true);
function toast(msg, { acao, fn, tempo = 3500 } = {}) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${acao ? `<button>${esc(acao)}</button>` : ''}`;
  if (acao) t.querySelector('button').onclick = () => { t.remove(); if (fn) fn(); };
  const pilha = $('#toasts'); while (pilha.children.length >= 3) pilha.firstElementChild.remove();
  pilha.appendChild(t);
  if (tempo) setTimeout(() => t.remove(), tempo);
  return t;
}
function erroAoSalvar(e) {
  console.error(e);
  const msg = (e && (e.name || '') + ' ' + (e.message || '')) || '';
  if (/quota/i.test(msg)) {
    modal({ titulo: 'Espaço cheio', html: '<p>O navegador não tem mais espaço para guardar dados neste aparelho.</p><p>Exporte um backup e remova anexos grandes que você não precisa mais.</p>' });
  } else toast('Não foi possível salvar: ' + ((e && e.message) || e));
}

const LEMBRETE_PADRAO = { ativo: true, hora: '08:00', intervalo: 120, som: true };
const configLembrete = () => Object.assign({}, LEMBRETE_PADRAO, S.config.lembrete || {});
function slotLembrete(cfg) {
  const agora = new Date();
  const [hh, mm] = String(cfg.hora || '08:00').split(':').map(Number);
  const ini = (hh || 0) * 60 + (mm || 0), now = agora.getHours() * 60 + agora.getMinutes();
  if (now < ini) return null;
  if (!+cfg.intervalo) return ini;
  return ini + Math.floor((now - ini) / +cfg.intervalo) * +cfg.intervalo;
}
const chaveLembrete = () => { const s = slotLembrete(configLembrete()); return s === null ? null : `${hojeISO()} ${s}`; };

/* som de alerta (gerado pelo próprio navegador, sem arquivo) */
let audioCtx = null;
function prepararAudio() {
  try {
    if (!audioCtx) { const C = window.AudioContext || window.webkitAudioContext; if (C) audioCtx = new C(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', prepararAudio, { passive: true });
document.addEventListener('keydown', prepararAudio);
function tocarAlerta() {
  try {
    prepararAudio(); if (!audioCtx) return;
    const t0 = audioCtx.currentTime + 0.05;
    [[0, 784], [0.22, 784], [0.44, 1047]].forEach(([dt, f]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.22);
    });
  } catch (e) {}
}

/* ---- notificações do navegador ---- */
function situacaoPermissao() {
  if (!('Notification' in window)) {
    return { cls: 'ruim', txt: ehIOS ? 'No iPhone/iPad as notificações só existem com a agenda publicada num site e instalada na Tela de Início (iOS 16.4 ou mais novo). Use o lembrete na tela.' : 'Este navegador não oferece notificações. Use o lembrete na tela.' };
  }
  if (location.protocol === 'file:') {
    return { cls: 'ruim', txt: 'A agenda está aberta direto do computador (arquivo). Nesse modo o Chrome e o Edge bloqueiam as notificações. Elas funcionam quando a agenda é aberta por um endereço https (ex.: publicada na Square Cloud). O lembrete na tela funciona normalmente.' };
  }
  if (!window.isSecureContext) return { cls: 'ruim', txt: 'O endereço precisa começar com https para o navegador permitir notificações.' };
  const p = Notification.permission;
  if (p === 'granted') return { cls: 'ok', txt: 'Permissão concedida pelo navegador.' };
  if (p === 'denied') return { cls: 'ruim', txt: 'As notificações estão bloqueadas para este site. Clique no cadeado (ou ícone de ajustes) ao lado do endereço › Notificações › Permitir e recarregue a página.' };
  return { cls: 'neutra', txt: 'Ainda não autorizada. Ligue a chave abaixo e clique em "Permitir" quando o navegador perguntar.' };
}
async function enviarNotificacao(teste) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return { ok: false, erro: 'permissao' };
  let corpo;
  if (teste) corpo = 'Tudo certo! As notificações da agenda estão funcionando.';
  else {
    const { atr, hoje } = contadores();
    corpo = [atr ? `${atr} ${plural(atr, 'atrasada', 'atrasadas')}` : '', hoje ? `${hoje} para hoje` : ''].filter(Boolean).join(' · ');
    if (!corpo) return { ok: false, erro: 'vazio' };
  }
  const icone = ($('link[rel="icon"]') || {}).href;
  const op = { body: corpo, tag: teste ? 'teste' : 'resumo-do-dia', icon: icone, renotify: !teste };
  let erroSW = null;
  try {
    const reg = ehWeb && navigator.serviceWorker ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    if (reg) { await reg.showNotification('Agenda de Demandas', op); return { ok: true }; }
  } catch (e) { erroSW = e; }
  try {
    const n = new Notification('Agenda de Demandas', op);
    n.onclick = () => { window.focus(); n.close(); };
    return { ok: true };
  } catch (e) {
    const semConstrutor = /constructor|ServiceWorkerRegistration/i.test((e && e.message) || '') || (/android/i.test(navigator.userAgent) && e && e.name === 'TypeError');
    return { ok: false, erro: semConstrutor && !erroSW ? 'android' : (((erroSW || e) && (erroSW || e).message) || 'erro desconhecido') };
  }
}
function explicarFalha(r) {
  if (r.erro === 'android') return 'No Android, o navegador só mostra notificações quando a agenda é publicada junto com o arquivo service-worker.js (o pacote .zip completo). Com o HTML sozinho, use o lembrete na tela.';
  if (r.erro === 'permissao') return situacaoPermissao().txt;
  return 'O navegador recusou a notificação: ' + r.erro;
}
async function ligarNotificacoes(ligar) {
  if (!ligar) { await salvarConfig('notificacoes', false); toast('Notificações desligadas'); renderView(); return; }
  if ('Notification' in window && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (e) {}
  }
  if (!('Notification' in window) || Notification.permission !== 'granted') {
    await salvarConfig('notificacoes', false); renderView();
    modal({ titulo: 'Não foi possível ativar', html: `<p>${esc(situacaoPermissao().txt)}</p><p>O <b>lembrete na tela</b> (nesta mesma seção) funciona mesmo assim.</p>` });
    return;
  }
  const r = await enviarNotificacao(true);
  if (!r.ok) {
    await salvarConfig('notificacoes', false); renderView();
    modal({ titulo: 'Não foi possível ativar', html: `<p>${esc(explicarFalha(r))}</p>` });
    return;
  }
  await salvarConfig('notificacoes', true); renderView();
  toast('Notificações ativadas. Veja a notificação de teste.');
}
async function testarNotificacao() {
  if (!('Notification' in window) || Notification.permission !== 'granted') { ligarNotificacoes(true); return; }
  const r = await enviarNotificacao(true);
  if (r.ok) toast('Notificação de teste enviada. Se não apareceu, veja a dica abaixo do botão.', { tempo: 6000 });
  else modal({ titulo: 'Notificação não enviada', html: `<p>${esc(explicarFalha(r))}</p>` });

  if (((e.key === '/' && !digitando) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && !$('.modal-wrap') && !F) { e.preventDefault(); abrirBusca(); return; }
  if (t && t.id === 'gbusca') {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fecharBusca(true); }
    else if (e.key === 'Enter') { const p = $('#gbusca-res .gb-item'); if (p) { e.preventDefault(); p.click(); } }
    else if (e.key === 'ArrowDown') { const p = $('#gbusca-res .gb-item'); if (p) { e.preventDefault(); p.focus(); } }
  } else if (t && t.classList && t.classList.contains('gb-item') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const itens = $$('#gbusca-res .gb-item'), i = itens.indexOf(t) + (e.key === 'ArrowDown' ? 1 : -1);
    if (i < 0) $('#gbusca').focus(); else if (itens[i]) itens[i].focus();
  } else if (e.key === 'Escape' && t && t.closest && t.closest('#gbusca-res')) fecharBusca(true);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.kcard, .item[data-act], .tl-row[data-act]')) { e.preventDefault(); abrirDemanda(e.target.dataset.id); }
  if (!F || $('.modal-wrap')) return;
  if (e.key === 'Escape') fecharDrawer();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); salvarDemanda(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca') { S.lista.busca = e.target.value; renderItensLista(); }
  else if (e.target.id === 'gbusca') renderBuscaGlobal();
  else if (e.target.id === 'arq-busca') { S.arq.busca = e.target.value; renderListaArquivos(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-cat') { S.lista.cat = t.value; renderItensLista(); }
  else if (t.id === 'f-prio') { S.lista.prio = t.value; renderItensLista(); }
  else if (t.id === 'fm-cat') trocarCategoriaNoForm(t);
  else if (t.id === 'fm-inicio') {
    const fim = $('#fm-fim'), rec = $('#fm-rep').value !== 'nao';
    if (t.value && ((fim.value && fim.value < t.value) || (!fim.value && !rec))) fim.value = t.value;
    renderHistorico();
  }
  else if (t.id === 'fm-fim') { if (F) F.fimTocado = true; renderHistorico(); }
  else if (t.id === 'fm-rep') {
    const ini = $('#fm-inicio'), fim = $('#fm-fim');
    if (t.value !== 'nao' && fim.value && (fim.value === ini.value || (F && F.novo && !F.fimTocado))) fim.value = '';   /* recorrente: sem data final por padrão */
    if (t.value === 'nao' && !fim.value) fim.value = ini.value;
    if (t.value === 'semanal' && !$$('#fm-dias .chip-dia.on').length && ini.value) {
      const b = $(`#fm-dias .chip-dia[data-i="${diaSemana(ini.value)}"]`); if (b) { b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
    }
    if (t.value === 'diaria' || t.value === 'uteis') { const st = $('#fm-status'); if (st.value === 'afazer' && F && F.novo) st.value = 'andamento'; }
    atualizarModoRec();
  }
  else if (t.id === 'inp-arquivos' || t.id === 'inp-foto') { await adicionarArquivos(t.files); t.value = ''; }
  else if (t.id === 'inp-backup') { if (t.files[0]) await importarBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'notif') ligarNotificacoes(t.checked);
  else if (t.id === 'lem-ativo') salvarLembrete({ ativo: t.checked });
  else if (t.id === 'lem-som') { salvarLembrete({ som: t.checked }); if (t.checked) tocarAlerta(); }
  else if (t.id === 'lem-hora') { if (t.value) salvarLembrete({ hora: t.value }); }
  else if (t.id === 'lem-int') salvarLembrete({ intervalo: +t.value });
  else if (t.id === 'inp-arq' || t.id === 'inp-arq-foto') { const fs = [...t.files]; t.value = ''; await enviarParaArquivo(fs); }
  else if (t.id === 'arq-destino') escolherPastaDestino(t);
  else if (t.id === 'arq-ordem') { S.arq.ordem = t.value; renderListaArquivos(); }
  else if (t.dataset.catNome) {
    const c = categoria(t.dataset.catNome); const nome = t.value.trim();
    if (!c) return;
    if (!nome) { t.value = c.nome; return; }
    c.nome = nome;
    try { await DB.gravar('categorias', c); toast('Categoria renomeada'); } catch (err) { erroAoSalvar(err); }
    S.categorias.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'cat-nova') ACOES['cat-adicionar'](); });
/* arrastar arquivos do computador para o painel */
const zonaAtual = () => F ? $('#anx-zona') : $('#arq-zona');
window.addEventListener('dragover', e => {
  e.preventDefault();
  const z = zonaAtual(); if (z) z.classList.add('sobre');
});
window.addEventListener('dragleave', e => { if (!e.relatedTarget) { const z = zonaAtual(); if (z) z.classList.remove('sobre'); } });
window.addEventListener('drop', e => {
  e.preventDefault();
  const z = zonaAtual(); if (z) z.classList.remove('sobre');
  const fs = e.dataTransfer && e.dataTransfer.files;
  if (!fs || !fs.length) return;
  if (F) adicionarArquivos(fs);
  else if (S.view === 'arquivos') enviarParaArquivo(fs);
  else toast('Para guardar arquivos, abra uma demanda ou a aba Arquivos e solte lá.');
});

/* ---------- 16. App instalável (PWA) e atualizações ---------- */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); S.instalar = e; renderMoldura();
  if (S.view === 'mais') renderView();
});
window.addEventListener('appinstalled', () => { S.instalar = null; renderMoldura(); toast('App instalado'); });
function avisarAtualizacao(worker) {
  toast('Nova versão disponível', { acao: 'Atualizar', tempo: 0, fn: () => { S.recarregarSW = true; worker.postMessage('ATUALIZAR'); } });
}
async function registrarServiceWorker() {
  if (!ehWeb || !('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('service-worker.js');
    if (reg.waiting && navigator.serviceWorker.controller) avisarAtualizacao(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisarAtualizacao(w); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (S.recarregarSW) location.reload(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  } catch (e) { console.warn('Service worker não registrado', e); }
}

/* ---------- 17. Início ---------- */
let diaAtual = hojeISO();
function checarVirada() {
  const h = hojeISO();
  if (h === diaAtual) return;
  diaAtual = h;
  if (!F) render(); else renderMoldura();
  verificarNotificacao();
  verificarLembrete();
}
async function iniciar() {
  preencherIcones();
  aplicarTema();
  try { await DB.abrir(); }
  catch (e) {
    $('#view').innerHTML = `<div class="vazio"><h3>Não foi possível abrir o armazenamento</h3><p>Este navegador bloqueou o banco de dados (pode estar em modo anônimo/privado). Abra a agenda numa janela normal do Chrome, Edge ou Safari.</p><p class="dica">${esc(e && e.message)}</p></div>`;
    return;
  }
  await carregarDados();
  render();
  pedirPersistencia(false);
  registrarServiceWorker();
  verificarNotificacao();
  setTimeout(resumoAoAbrir, 400);
  setInterval(checarVirada, 60000);
  setInterval(verificarLembrete, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checarVirada(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (temaPreferido() === 'auto') { aplicarTema(); renderMoldura(); } });
  window.matchMedia('(min-width: 900px)').addEventListener('change', () => { if (S.view === 'calendario') renderView(); });
}
iniciar();
</script>
</body>
</html>
